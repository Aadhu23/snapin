<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex">
    <title>Workspace &middot; SnapIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <header class="app-header">
            <span class="wordmark">
                <span class="wordmark-dot" aria-hidden="true"></span>
                SnapIN
            </span>

            <div class="app-header-right">
                <div class="identity" id="identity" hidden>
                    <img class="avatar" id="identity-avatar" alt="" hidden>
                    <span class="avatar avatar-fallback" id="identity-initials" hidden></span>
                    <span class="identity-name" id="identity-name"></span>
                </div>

                <div class="status">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text">Disconnected</span>
                </div>

                <button type="button" class="btn btn-ghost btn-compact" id="logout-btn">
                    Sign out
                </button>
            </div>
        </header>

        <main class="app-main">
            <div class="stage">
                <video id="webcam" autoplay playsinline muted></video>

                <div class="stage-empty" id="stage-empty">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                        <rect x="1.5" y="4" width="12" height="12" rx="2" stroke="currentColor"
                            stroke-width="1.5" />
                        <path d="M13.5 8.5 18.5 5v10l-5-3.5" stroke="currentColor" stroke-width="1.5"
                            stroke-linejoin="round" />
                    </svg>
                    <span id="stage-empty-title">Camera is off</span>
                    <span class="stage-empty-hint">Start the guard to begin monitoring</span>
                </div>

                <div class="alert-overlay" id="alert-overlay" role="alert" aria-live="assertive">
                    <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"
                        class="alert-overlay-icon">
                        <path d="M8 1.8 15 14H1L8 1.8Z" stroke="currentColor" stroke-width="1.4"
                            stroke-linejoin="round" />
                        <path d="M8 6.2v3.1M8 11.3v.3" stroke="currentColor" stroke-width="1.4"
                            stroke-linecap="round" />
                    </svg>
                    <div class="alert-overlay-text">
                        <span class="alert-overlay-title">Phone detected</span>
                        <span class="alert-overlay-meta" id="alert-detail"></span>
                    </div>
                    <span class="alert-badge">alert</span>
                </div>
            </div>

            <div class="controls">
                <button type="button" class="btn btn-primary" id="toggle-btn">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <circle cx="8" cy="8" r="3" fill="currentColor" />
                        <path d="M8 1v2.2M8 12.8V15M15 8h-2.2M3.2 8H1M12.9 3.1l-1.6 1.6M4.7 11.3l-1.6 1.6M12.9 12.9l-1.6-1.6M4.7 4.7 3.1 3.1"
                            stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                    </svg>
                    <span>Start guard</span>
                </button>

                <a class="btn btn-secondary" id="stats-btn" href="stats.html">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M2 14V9M7 14V4M12 14V6.5" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" />
                    </svg>
                    <span>Stats</span>
                </a>
            </div>

            <div class="account-bar" id="account-bar" hidden>
                <div class="account-meta">
                    <span class="account-username" id="account-username"></span>
                    <span class="account-email" id="account-email"></span>
                </div>
                <div class="account-methods" id="account-methods"></div>
                <a class="btn btn-ghost btn-compact" id="account-google-link" href="/api/auth/google"
                    hidden>Link Google</a>
            </div>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
