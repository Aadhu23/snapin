<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapIN - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="dashboard-screen">
        <header>
            <div class="logo">
                <h2 style="font-weight: 700; color: white;">Snap <span style="color: var(--primary);">IN</span></h2>
            </div>
            <div class="status-badge">
                <div class="status-dot" id="connection-dot"></div>
                <span id="connection-text">Disconnected</span>
            </div>
        </header>

        <div class="main-content">
            <div class="video-container">
                <video id="webcam" autoplay playsinline muted></video>
                <div class="overlay-message" id="alert-overlay">
                    <h2>⚠️ ALERT</h2>
                    <p>Phone Detected! Get back to work!</p>
                </div>
            </div>

            <div class="controls">
                <button id="toggle-btn" class="btn-toggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
                    </svg>
                    <span>Turn On Guard</span>
                </button>
                <button class="btn-toggle" onclick="alert('Stats Coming Soon!')"
                    style="background: var(--primary);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20v-6M6 20V10M18 20V4" />
                    </svg>
                    <span>Stats</span>
                </button>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
