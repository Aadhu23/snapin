<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex">
    <title>Confirm &middot; SnapIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="auth">
        <div class="auth-inner">
            <header class="auth-header">
                <span class="wordmark">
                    <span class="wordmark-dot" aria-hidden="true"></span>
                    SnapIN
                </span>
                <h1 class="auth-title">One more step</h1>
                <p class="auth-subtitle">Confirm it's you before linking Google</p>
            </header>

            <div id="link-error" class="alert-banner" role="alert" aria-live="assertive">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5" />
                    <path d="M8 4.5v4.5M8 11.2v.3" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" />
                </svg>
                <span id="link-error-text"></span>
            </div>

            <div class="link-card">
                <p class="link-line">
                    The Google account <strong id="link-email">&mdash;</strong> is already
                    used here for <strong id="link-username">&mdash;</strong>.
                </p>
                <p class="link-note">
                    Enter that account's password to attach Google sign-in to it. Your
                    study stats stay in one place.
                </p>
            </div>

            <form id="link-form" class="auth-form" novalidate>
                <div class="field">
                    <label class="field-label" for="link-password">Current password</label>
                    <input class="input" id="link-password" type="password"
                        autocomplete="current-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" id="link-submit">
                    Link Google account
                </button>
            </form>

            <button type="button" class="btn btn-ghost btn-block" id="link-skip">
                Skip, keep them separate
            </button>
        </div>
    </main>

    <script src="link-account.js"></script>
</body>

</html>
